# ─────────────────────────────────────────────────
# Nginx para eccursos.com (comparte la VM con Flujo)
# Copiar a /etc/nginx/sites-available/eccursos y activarlo (ver deploy/DEPLOY.md).
# Solo escucha en el puerto 80: Certbot agrega el bloque HTTPS y la
# redirección automáticamente al ejecutar `certbot --nginx`.
# ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name eccursos.com www.eccursos.com;

    # Frontend (build de Vite)
    root /var/www/eccursos/frontend/dist;
    index index.html;

    # Portadas y avatares (el backend limita a 3 MB; el default de Nginx es 1 MB)
    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre: se pueden cachear un año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: todas las rutas van a index.html (sin caché, para tomar cada deploy)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API backend (Node.js en el puerto 5100; Flujo usa el 5000)
    location /api/ {
        proxy_pass         http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Archivos subidos (portadas, avatares) servidos por el backend
    location /uploads/ {
        proxy_pass         http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        expires 7d;
    }
}
